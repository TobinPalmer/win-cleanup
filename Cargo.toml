[package]
name = "win-cleanup"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Preview-first Windows cleanup from WSL"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
walkdir = "2"
